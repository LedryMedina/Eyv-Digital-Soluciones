services:
  - type: web
    name: eyv-digital-soluciones
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py init-admin && gunicorn run:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: eyv-digital-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador Eyv
      - key: ADMIN_EMAIL
        value: admin@eyvdigital.local
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: eyv-digital-db
    databaseName: eyv_digital
    user: eyv_admin
    plan: free
